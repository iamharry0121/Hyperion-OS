<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <title>HyperionOS</title>
    </head>
    <body>
        <div id="desktop-canvas">
            <div id="taskbar">
                <button type="button" id="taskbar-icon" onclick="toggleWindow()"></button>
            </div>

            <div class="os-window">
                <div id="window-header" onmousedown="dragStart(event)">
                    <div class="minimize-button">
                        <button type="button" onclick="toggleWindow()">—</button>
                    </div>
                    <div class="maximize-button">
                        <button type="button" onclick="fullscreenToggle()">▢</button>
                    </div>
                    <div class="close-button" >
                        <button type="button" onclick="xOut()">X</button>
                    </div>
                </div>
            </div>
        </div>
        <script src='script.js'></script>
    </body>
</html>
