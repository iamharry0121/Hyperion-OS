<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <title>HyperionOS</title>
    </head>
    <body>
        <div id="desktop-canvas">
            
            <div id="taskbar">
                <button type="button" class="taskbar-icon" onclick="toggleWindow(event)" data-app="calculator">Calc</button>
                <button type="button" class="taskbar-icon" onclick="toggleWindow(event)" data-app="text-editor">Notes</button>
            </div>

            <div class="os-window" data-window-type="calculator">
                <div class="window-header" onmousedown="dragStart(event)">
                    <div class="window-title">Calculator</div>
                    <div class="window-controls">
                        <div class="minimize-button">
                            <button type="button" onclick="toggleWindow(event)">—</button>
                        </div>
                        <div class="maximize-button">
                            <button type="button" onclick="fullscreenToggle(event)">▢</button>
                        </div>
                        <div class="close-button">
                            <button type="button" onclick="xOut(event)">X</button>
                        </div>
                    </div>
                </div>
                <div class="window-content"></div>
            </div>

            <div class="os-window" data-window-type="text-editor" style="left: 20%; top: 20%;">
                <div class="window-header" onmousedown="dragStart(event)">
                    <div class="window-title">Text Editor</div>
                    <div class="window-controls">
                        <div class="minimize-button">
                            <button type="button" onclick="toggleWindow(event)">—</button>
                        </div>
                        <div class="maximize-button">
                            <button type="button" onclick="fullscreenToggle(event)">▢</button>
                        </div>
                        <div class="close-button">
                            <button type="button" onclick="xOut(event)">X</button>
                        </div>
                    </div>
                </div>
                <div class="window-content"></div>
            </div>

        </div>
        <script src='script.js'></script>
    </body>
</html>
